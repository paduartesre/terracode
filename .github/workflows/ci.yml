name: TerraCode CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: Build, tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Build and type check
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Frontend tests and coverage
        id: frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage
      - name: Backend tests and coverage
        id: backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:server
      - name: Isolated API integration tests
        id: integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:integration
      - name: Test notification safety
        id: automation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 -m unittest discover -s scripts -p 'test_notify_ci.py'
      - name: Build review report
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend.outcome }}
          BACKEND_RESULT: ${{ steps.backend.outcome }}
          INTEGRATION_RESULT: ${{ steps.integration.outcome }}
          AUTOMATION_RESULT: ${{ steps.automation.outcome }}
        run: node scripts/ci-report.mjs
      - name: Upload concise review report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-report
          path: .reports/ci-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage and test details
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-and-tests
          path: |
            coverage/
            .reports/*.xml
            .reports/frontend.json
            .reports/backend.json
            .reports/integration.json
          if-no-files-found: warn
          retention-days: 14

